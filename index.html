<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bitcast</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f1115;
            color: #e6e6e6;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            border-bottom: 1px solid #242832;
            background: #14171d;
        }

        .header {
            max-width: 1100px;
            margin: auto;
            padding: 18px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
        }

        .version {
            color: #777;
            font-size: 13px;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
        }

        section {
            margin-bottom: 40px;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 18px;
        }

        .description {
            color: #8d939e;
            margin-bottom: 35px;
        }

        .card {
            background: #15181e;
            border: 1px solid #272b34;
            border-radius: 8px;
            padding: 20px;
        }

        .upload {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="file"] {
            max-width: 100%;
            color: #aaa;
        }

        button {
            border: 1px solid #343944;
            background: #20242c;
            color: #eee;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #292e38;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #uploadStatus {
            margin: 12px 0 0;
            color: #8d939e;
            font-size: 14px;
        }

        .videos-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video {
            background: #15181e;
            border: 1px solid #272b34;
            border-radius: 7px;
            padding: 14px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .video-info {
            min-width: 0;
        }

        .video-name {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-meta {
            margin-top: 5px;
            color: #777e89;
            font-size: 12px;
        }

        .video-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .player-container {
            background: #090b0e;
            border: 1px solid #272b34;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            display: block;
            width: 100%;
            max-height: 650px;
            background: #000;
        }

        .player-info {
            padding: 12px 16px;
            color: #777e89;
            font-size: 13px;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #777e89;
            border: 1px dashed #30343d;
            border-radius: 7px;
        }

        .error {
            color: #d96c6c !important;
        }

        footer {
            max-width: 1100px;
            margin: 60px auto 30px;
            padding: 0 24px;
            color: #555b66;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            main {
                margin-top: 25px;
            }

            .video {
                align-items: flex-start;
                flex-direction: column;
            }

            .video-actions {
                width: 100%;
            }

            .video-actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header">
            <div class="brand">Bitcast</div>
            <div class="version">V2 · Local Video Storage</div>
        </div>
    </header>

    <main>

        <h1>Video Library</h1>

        <p class="description">
            Local video storage and streaming interface.
        </p>

        <!-- Upload -->

        <section>
            <h2>Upload</h2>

            <div class="card">

                <div class="upload">

                    <input id="videoInput" type="file" accept="video/*">

                    <button id="uploadButton" onclick="uploadVideo()">
                        Upload
                    </button>

                </div>

                <p id="uploadStatus"></p>

            </div>
        </section>


        <!-- Videos -->

        <section>

            <div class="videos-header">

                <h2>Videos</h2>

                <button onclick="loadVideos()">
                    Refresh
                </button>

            </div>

            <div id="videos" class="video-list"></div>

        </section>


        <!-- Player -->

        <section>

            <h2>Player</h2>

            <div class="player-container">

                <video id="player" controls preload="metadata"></video>

                <div id="playerInfo" class="player-info">
                    No video selected.
                </div>

            </div>

        </section>

    </main>

    <footer>
        Bitcast · Local VOD infrastructure
    </footer>


    <script>

        const API = "http://localhost:9090";

        async function uploadVideo() {

            const input = document.getElementById("videoInput");
            const status = document.getElementById("uploadStatus");
            const button = document.getElementById("uploadButton");

            if (!input.files.length) {

                status.textContent = "Select a video first.";
                status.classList.add("error");

                return;
            }

            const file = input.files[0];

            const form = new FormData();

            form.append("video", file);

            status.classList.remove("error");

            status.textContent =
                `Uploading ${file.name}...`;

            button.disabled = true;

            try {

                const response = await fetch(`${API}/videos`, {
                    method: "POST",
                    body: form
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                status.textContent =
                    `Uploaded ${file.name}.`;

                input.value = "";

                await loadVideos();

            } catch (error) {

                console.error(error);

                status.textContent =
                    `Upload failed: ${error.message}`;

                status.classList.add("error");

            } finally {
                button.disabled = false;
            }
        }


        async function loadVideos() {

            const container = document.getElementById("videos");

            container.innerHTML =
                `<div class="empty">Loading...</div>`;

            try {

                const response =
                    await fetch(`${API}/videos`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const videos =
                    await response.json();

                container.innerHTML = "";

                if (!videos.length) {

                    container.innerHTML =
                        `<div class="empty">
                    No videos stored.
                </div>`;

                    return;
                }

                for (const video of videos) {

                    const element =
                        document.createElement("div");

                    element.className = "video";

                    const name =
                        video.originalFilename ||
                        video.id;

                    const size =
                        formatBytes(video.size);

                    const type =
                        video.contentType ||
                        "unknown";

                    const status =
                        video.status ||
                        "unknown";

                    element.innerHTML = `

                <div class="video-info">

                    <div class="video-name"
                        title="${escapeHtml(name)}">

                        ${escapeHtml(name)}

                    </div>

                    <div class="video-meta">

                        ${escapeHtml(type)}
                        ·
                        ${size}
                        ·
                        ${escapeHtml(status)}
                        ·
                        ${video.id}

                    </div>

                </div>

                <div class="video-actions">

                    <button
                        onclick="playVideo('${video.id}', '${escapeHtml(name)}')">

                        Play

                    </button>

                    <button
                        onclick="downloadVideo('${video.id}')">

                        Download

                    </button>

                    <button
                        onclick="deleteVideo('${video.id}')">

                        Delete

                    </button>

                </div>
            `;

                    container.appendChild(element);
                }

            } catch (error) {

                console.error(error);

                container.innerHTML =
                    `<div class="empty error">
                Failed to load videos:
                ${escapeHtml(error.message)}
            </div>`;
            }
        }

        function playVideo(id, name) {

            const player =
                document.getElementById("player");

            const info =
                document.getElementById("playerInfo");

            player.src =
                `${API}/videos/${id}/stream`;

            info.textContent =
                `${name} · ${id}`;

            player.play();
        }

        function downloadVideo(id) {

            const url =
                `${API}/videos/${id}/stream`;

            const link =
                document.createElement("a");

            link.href = url;
            link.download = "";

            document.body.appendChild(link);

            link.click();

            link.remove();
        }

        async function deleteVideo(id) {

            if (!confirm(
                "Delete this video?"
            )) {
                return;
            }

            try {

                const response =
                    await fetch(`${API}/videos/${id}`, {
                        method: "DELETE"
                    });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                await loadVideos();

            } catch (error) {

                console.error(error);

                alert(
                    `Delete failed: ${error.message}`
                );
            }
        }

        function formatBytes(bytes) {

            if (!bytes) {
                return "0 B";
            }

            const units = [
                "B",
                "KB",
                "MB",
                "GB",
                "TB"
            ];

            const index =
                Math.floor(
                    Math.log(bytes) / Math.log(1024)
                );

            return `${(
                bytes / Math.pow(1024, index)
            ).toFixed(2)} ${units[index]}`;
        }


        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        loadVideos();

    </script>

</body>

</html>
